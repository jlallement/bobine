# Version installable (fiche 059) : à chaque tag `v*`, construit le .dmg sur un Mac Apple Silicon
# de GitHub, et l'attache à une Release. Lancement à la main (onglet Actions) : le .dmg est gardé
# 7 jours comme artefact, sans Release.
#
# Préversion Linux (fiche 145, ADR-0032, ADR-0051) : le .deb seul, construit sous Ubuntu, une machine
# par architecture (x64, arm64), puis joints à la Release du .dmg (même tag, même numéro) avec
# leur somme SHA-256 ; à la main, gardés 7 jours comme artefacts. Expérimentale tant que la
# variable du dépôt BOBINE_LINUX_RELEASE ne vaut pas `true` (Settings › Secrets and variables ›
# Actions › Variables) : un tag ne construit alors que le .dmg, le lancement à la main construit
# toujours Linux.
#
# Préversion Windows (fiche 229, D1 à D3, D7) : installeurs NSIS (pour l'utilisateur seul, sans droits
# d'administrateur), une machine Windows par architecture (x64, arm64 : les binaires de koffi sont
# installés par pnpm pour la machine qui construit), joints à la même Release avec leur somme
# SHA-256 ; non signés (SmartScreen avertit, docs/installation.md). Même interrupteur que Linux :
# la variable du dépôt BOBINE_WINDOWS_RELEASE doit valoir `true` pour qu'un tag les construise ;
# le lancement à la main les construit toujours (gardés 7 jours comme artefacts).
#
# Dépôt public (fiche 218) : le jeton est en lecture partout ; seul le job `publish`, qui ne fait
# que télécharger les fichiers construits et créer la Release, l'a en écriture. Une Release ne part
# que d'un commit de `main` dont `ci.yml` est vert sur macOS, Linux et Windows (job `guard`). Un tag avec suffixe (`v1.0.0-beta.1`) donne une
# Release « préversion », jamais « Latest ». Actions tierces épinglées par SHA (Dependabot).
#
# Signature (fiche 111). Sans secret, signature ad hoc, comme `pnpm package` en local. Avec ces
# secrets du dépôt (Settings › Secrets and variables › Actions), signature Developer ID, runtime
# durci, notarisation et agrafage de l'app et du .dmg :
#   MAC_CERTIFICATE_P12        certificat « Developer ID Application » et sa clé, exportés en .p12,
#                              en base64 (`base64 -i DeveloperID.p12 | pbcopy`) → CSC_LINK
#   MAC_CERTIFICATE_PASSWORD   mot de passe choisi à l'export du .p12 → CSC_KEY_PASSWORD
# et, pour la notarisation, de préférence une clé d'API App Store Connect (rôle « Developer ») :
#   APPLE_API_KEY_P8           contenu du fichier AuthKey_XXXXXXXXXX.p8 (écrit dans un fichier
#                              temporaire du runner → APPLE_API_KEY, effacé à la fin)
#   APPLE_API_KEY_ID           identifiant de la clé (XXXXXXXXXX)
#   APPLE_API_ISSUER           « Issuer ID » de la page des clés (UUID)
# ou bien l'identifiant Apple :
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD (appleid.apple.com › Mots de passe d'app), APPLE_TEAM_ID
# Un jeu incomplet arrête la construction (`--strict`) : jamais de .dmg signé mais pas notarisé.
# Les secrets ne sont donnés qu'aux étapes de signature, pas à l'installation ni aux tests.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: tag ↔ version, commit de main, CI verte
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      checks: read
    steps:
      # Historique complet : `origin/main` sert à vérifier d'où part le tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Le tag correspond à la version de package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME, mais package.json est en $version : mettre la version à jour avant de taguer."
            exit 1
          fi

      # Un tag posé sur une branche de travail (ou par un jeton volé) ne publie rien : pousser
      # `main` d'abord, puis le tag.
      - name: Le commit tagué est sur main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME sur $GITHUB_SHA, absent de main : pousser main avant le tag."
            exit 1
          fi

      # CI bloquante sur les trois systèmes (fiche 229, décision de Jérôme) : un tag ne construit
      # rien tant que `ci.yml` n'est pas vert sur macOS, Linux et Windows pour ce commit. Lecture
      # du statut du commit par l'API (jeton du job, lecture seule, aucun secret) ; on attend les
      # jobs encore en cours (poussée de `main` juste avant le tag), une heure au plus.
      - name: CI verte sur les trois systèmes pour ce commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          required=('verify (macOS)' 'verify (Linux)' 'verify (Windows)')
          deadline=$((SECONDS + 3600))
          while :; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"
            waiting=()
            for name in "${required[@]}"; do
              line="$(awk -F '\t' -v n="$name" '$1 == n' <<< "$runs" | head -n 1)"
              status="$(cut -f2 <<< "$line")"
              conclusion="$(cut -f3 <<< "$line")"
              if [[ -z "$line" || "$status" != "completed" ]]; then
                waiting+=("$name")
              elif [[ "$conclusion" != "success" ]]; then
                echo "::error::$name : $conclusion sur $GITHUB_SHA. Corriger, pousser main, puis reposer le tag."
                exit 1
              fi
            done
            if [[ ${#waiting[@]} -eq 0 ]]; then
              echo "CI verte sur les trois systèmes pour $GITHUB_SHA."
              break
            fi
            if (( SECONDS > deadline )); then
              echo "::error::CI pas terminée après une heure : ${waiting[*]}."
              exit 1
            fi
            echo "En attente : ${waiting[*]}"
            sleep 30
          done

  dmg:
    name: .dmg (macOS arm64)
    needs: guard
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm : la version de `packageManager` (package.json).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Des tests créent des commits dans des dépôts jetables.
      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      - run: ./scripts/verify

      # Après les tests : la clé n'existe que le temps de la signature.
      - name: Clé d'API App Store Connect
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Signature, essai à blanc
        # Mêmes variables qu'à l'étape « Construire le .dmg ».
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Une configuration de signature incomplète s'arrête là, avant la construction.
        run: pnpm package --dry-run --strict

      - name: Construire le .dmg
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm package --strict --publish never

      # Signée : ce que Gatekeeper dira de l'app téléchargée (le .dmg est vérifié par
      # `scripts/signing.mts notarize-dmg`).
      - name: Vérifier la signature et la notarisation
        env:
          SIGNED: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
        run: |
          app=dist/mac-arm64/Bobine.app
          codesign --verify --deep --strict "$app"
          if [[ "$SIGNED" == true ]]; then
            spctl --assess --type exec -vv "$app"
            xcrun stapler validate "$app"
          else
            codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          fi

      # Version courte d'Info.plist en trois entiers (fiche 218, `scripts/package`), version
      # complète ailleurs.
      - name: Versions d'Info.plist
        run: |
          version="$(node -p "require('./package.json').version")"
          plist=dist/mac-arm64/Bobine.app/Contents/Info.plist
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          echo "CFBundleShortVersionString=$short CFBundleVersion=$bundle"
          test "$short" = "${version%%[-+]*}"
          test "$bundle" = "$version"

      - name: Essai natif du DMG (agent factice)
        run: |
          test "$(node -p 'process.arch')" = arm64
          version="$(node -p "require('./package.json').version")"
          smoke_mount="$(mktemp -d "$RUNNER_TEMP/bobine-dmg-smoke.XXXXXX")"
          # Après l'essai, un processus de l'app (terminal, AXe) peut tenir le volume quelques
          # secondes : on réessaie, puis on force le démontage (« Resource busy », 0.7.0).
          cleanup() {
            for _ in 1 2 3 4 5; do
              hdiutil detach "$smoke_mount" && break
              sleep 3
            done
            if mount | grep -q " on $smoke_mount "; then hdiutil detach -force "$smoke_mount"; fi
            if [[ -d "$smoke_mount" ]]; then rmdir "$smoke_mount"; fi
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$smoke_mount" "dist/Bobine-$version-arm64.dmg"
          file "$smoke_mount/Bobine.app/Contents/MacOS/Bobine" | grep -q arm64
          BOBINE_PACKAGED_APP="$smoke_mount/Bobine.app" node e2e/packaged-ci.mjs

      - name: Capture de l’essai natif
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-dmg-smoke
          path: e2e/captures/packaged.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Effacer la clé d'API
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Pour le job `publish` (tag) ou à télécharger (lancement à la main).
      - name: Artefact .dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: .deb (Linux ${{ matrix.arch }})
    needs: guard
    # Linux expérimental : jamais publié avec un tag sans BOBINE_LINUX_RELEASE (voir en tête).
    if: github.ref_type != 'tag' || vars.BOBINE_LINUX_RELEASE == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # node-pty se compile (pas de binaire précompilé pour Linux).
      - name: Outils de compilation
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: pnpm install --frozen-lockfile

      # Comme dans ci.yml : pnpm ne lance pas son script d'installation (`allowBuilds`), et les
      # tests du terminal (vrai shell) en ont besoin avant `verify`.
      - name: Compiler node-pty (pas de binaire précompilé pour Linux)
        run: cd node_modules/node-pty && npx --yes node-gyp@12 rebuild && node scripts/post-install.js

      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      - run: ./scripts/verify

      - name: Construire le .deb
        run: pnpm package --linux --publish never

      - name: Sommes SHA-256
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          version="$(node -p "require('../package.json').version")"
          sha256sum Bobine-"$version"-*.deb > "SHA256SUMS-linux-$ARCH.txt"
          cat "SHA256SUMS-linux-$ARCH.txt"

      # Pour le job `publish` (tag) ou à télécharger (lancement à la main).
      - name: Artefact Linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/SHA256SUMS-linux-*.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Installeur NSIS (Windows ${{ matrix.arch }})
    needs: guard
    # Windows expérimental : jamais publié avec un tag sans BOBINE_WINDOWS_RELEASE (voir en tête).
    if: github.ref_type != 'tag' || vars.BOBINE_WINDOWS_RELEASE == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # Avant le checkout : fins de ligne LF comme dans le dépôt (Prettier, essais).
      - name: Fins de ligne (LF)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      # Obligatoire pour un tag (Windows activé) ; au lancement à la main, un échec n'empêche pas
      # de construire l'installeur à essayer, tant que `verify` n'est pas vert sous Windows.
      - run: ./scripts/verify
        continue-on-error: ${{ github.ref_type != 'tag' }}

      # En node (pnpm lance les scripts par `cmd` sous Windows) ; contrôle le dossier de l'app.
      - name: Construire l'installeur
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/package-win.mts "--$ARCH" --publish never

      - name: Somme SHA-256
        run: |
          cd dist
          version="$(node -p "require('../package.json').version")"
          sha256sum "Bobine-$version-$ARCH.exe" > "SHA256SUMS-windows-$ARCH.txt"
          cat "SHA256SUMS-windows-$ARCH.txt"

      # Pour le job `publish` (tag) ou à télécharger (lancement à la main).
      - name: Artefact Windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bobine-windows-${{ matrix.arch }}
          path: |
            dist/Bobine-*.exe
            dist/SHA256SUMS-windows-*.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release GitHub
    needs: [dmg, linux, windows]
    # Au tag seulement, .dmg construit et essayé ; Linux et Windows construits, ou sautés faute de
    # BOBINE_LINUX_RELEASE / BOBINE_WINDOWS_RELEASE. Un échec de l'un d'eux (activé) ne publie
    # rien : pas de Release à moitié.
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.dmg.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Seulement les deux changelogs (notes) : rien du dépôt n'est installé ni lancé ici.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.en.md
            CHANGELOG.md
            docs/images/readme/en/hero-light.png
            docs/images/releases
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bobine-dmg
          path: dist

      - if: needs.linux.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bobine-linux-*
          merge-multiple: true
          path: dist

      - if: needs.windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bobine-windows-*
          merge-multiple: true
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Notes en anglais puis en français (fiche 220) : la section de la version dans
        # CHANGELOG.en.md (« ## X.Y.Z — November 10, 2026 ») et dans CHANGELOG.md
        # (« ## X.Y.Z — 10 novembre 2026 »), préversion comprise (« ## 1.0.0-beta.1 — date »).
        # Une langue sans section est omise ; aucune des deux : la liste des commits de GitHub.
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v v="$version" '/^## / { inside = index($0, "## " v " ") == 1; next } inside' "$1"
          }
          section CHANGELOG.en.md > notes-en.md
          section CHANGELOG.md > notes-fr.md
          : > notes.md
          if grep -q '[^[:space:]]' notes-en.md; then
            { echo '## English'; cat notes-en.md; } >> notes.md
          fi
          if grep -q '[^[:space:]]' notes-fr.md; then
            if [[ -s notes.md ]]; then printf '\n---\n\n' >> notes.md; fi
            { echo '## Français'; cat notes-fr.md; } >> notes.md
          fi
          # En tête des notes (fiche 225) : l'image de la version (`docs/images/releases/<version>.png`)
          # si elle existe, sinon l'image de tête du README ; puis le chemin d'installation non signée.
          if [[ -s notes.md ]]; then
            raw="https://github.com/$GH_REPO/raw/$GITHUB_REF_NAME"
            {
              if [[ -f "docs/images/releases/$version.png" ]]; then
                echo "![Bobine $version]($raw/docs/images/releases/$version.png)"
              elif [[ -f docs/images/readme/en/hero-light.png ]]; then
                echo "![Bobine]($raw/docs/images/readme/en/hero-light.png)"
              fi
              echo
              echo "**Install:** download \`Bobine-$version-arm64.dmg\` below (Apple Silicon, macOS 13+)." \
                "The app is not notarized: the first launch needs" \
                "**System Settings › Privacy & Security › Open Anyway** ([how](https://github.com/$GH_REPO#install))."
              echo
              # Linux seulement s'il a été construit (BOBINE_LINUX_RELEASE) : .deb seul (ADR-0051).
              if compgen -G 'dist/Bobine-*.deb' > /dev/null; then
                echo "**Linux (preview):** \`Bobine-$version-amd64.deb\` (x64) or \`Bobine-$version-arm64.deb\`" \
                  "(Ubuntu 24.04+, Debian): \`sudo apt install ./Bobine-$version-<arch>.deb\`" \
                  "([how](https://github.com/$GH_REPO/blob/main/docs/installation.md#linux-préversion))."
                echo
              fi
              # Windows seulement s'il a été construit (BOBINE_WINDOWS_RELEASE).
              if compgen -G 'dist/Bobine-*.exe' > /dev/null; then
                echo "**Windows (preview):** \`Bobine-$version-x64.exe\` or \`Bobine-$version-arm64.exe\`," \
                  "installed for the current user, no administrator rights. Not signed: if SmartScreen" \
                  "warns, **More info › Run anyway** ([how](https://github.com/$GH_REPO/blob/main/docs/installation.md#windows-préversion))."
                echo
              fi
              cat notes.md
            } > notes-full.md
            mv notes-full.md notes.md
          fi
          if [[ -s notes.md ]]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          cat notes.md
          # Préversion semver (`1.0.0-beta.1`, `1.0.0-rc.2`) : jamais « Latest ».
          if [[ "$version" == *-* ]]; then kind=(--prerelease --latest=false); else kind=(); fi
          # Linux et Windows seulement s'ils ont été construits (BOBINE_LINUX_RELEASE,
          # BOBINE_WINDOWS_RELEASE) ; le .dmg toujours.
          shopt -s nullglob
          files=(dist/*.dmg dist/*.deb dist/SHA256SUMS-linux-*.txt dist/*.exe dist/SHA256SUMS-windows-*.txt)
          ls -l "${files[@]}"
          test -f "dist/Bobine-$version-arm64.dmg"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "Bobine $version" \
            "${notes[@]}" ${kind[@]+"${kind[@]}"}
