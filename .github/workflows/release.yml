# Version installable (fiche 059) : à chaque tag `v*`, construit le .dmg sur un Mac Apple Silicon
# de GitHub, et l'attache à une Release. Lancement à la main (onglet Actions) : le .dmg est gardé
# 7 jours comme artefact, sans Release.
#
# Préversion Linux (fiche 145, ADR-0032) : AppImage et .deb construits sous Ubuntu, une machine
# par architecture (x64, arm64), puis joints à la Release du .dmg (même tag, même numéro) avec
# leur somme SHA-256 ; à la main, gardés 7 jours comme artefacts. Expérimentale tant que la
# variable du dépôt BOBINE_LINUX_RELEASE ne vaut pas `true` (Settings › Secrets and variables ›
# Actions › Variables) : un tag ne construit alors que le .dmg, le lancement à la main construit
# toujours Linux.
#
# Dépôt public (fiche 218) : le jeton est en lecture partout ; seul le job `publish`, qui ne fait
# que télécharger les fichiers construits et créer la Release, l'a en écriture. Une Release ne part
# que d'un commit de `main` (job `guard`). Un tag avec suffixe (`v1.0.0-beta.1`) donne une
# Release « préversion », jamais « Latest ». Actions tierces épinglées par SHA (Dependabot).
#
# Signature (fiche 111). Sans secret, signature ad hoc, comme `pnpm package` en local. Avec ces
# secrets du dépôt (Settings › Secrets and variables › Actions), signature Developer ID, runtime
# durci, notarisation et agrafage de l'app et du .dmg :
#   MAC_CERTIFICATE_P12        certificat « Developer ID Application » et sa clé, exportés en .p12,
#                              en base64 (`base64 -i DeveloperID.p12 | pbcopy`) → CSC_LINK
#   MAC_CERTIFICATE_PASSWORD   mot de passe choisi à l'export du .p12 → CSC_KEY_PASSWORD
# et, pour la notarisation, de préférence une clé d'API App Store Connect (rôle « Developer ») :
#   APPLE_API_KEY_P8           contenu du fichier AuthKey_XXXXXXXXXX.p8 (écrit dans un fichier
#                              temporaire du runner → APPLE_API_KEY, effacé à la fin)
#   APPLE_API_KEY_ID           identifiant de la clé (XXXXXXXXXX)
#   APPLE_API_ISSUER           « Issuer ID » de la page des clés (UUID)
# ou bien l'identifiant Apple :
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD (appleid.apple.com › Mots de passe d'app), APPLE_TEAM_ID
# Un jeu incomplet arrête la construction (`--strict`) : jamais de .dmg signé mais pas notarisé.
# Les secrets ne sont donnés qu'aux étapes de signature, pas à l'installation ni aux tests.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: tag ↔ version, commit de main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Historique complet : `origin/main` sert à vérifier d'où part le tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Le tag correspond à la version de package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME, mais package.json est en $version : mettre la version à jour avant de taguer."
            exit 1
          fi

      # Un tag posé sur une branche de travail (ou par un jeton volé) ne publie rien : pousser
      # `main` d'abord, puis le tag.
      - name: Le commit tagué est sur main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME sur $GITHUB_SHA, absent de main : pousser main avant le tag."
            exit 1
          fi

  dmg:
    name: .dmg (macOS arm64)
    needs: guard
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm : la version de `packageManager` (package.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Des tests créent des commits dans des dépôts jetables.
      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      - run: ./scripts/verify

      # Après les tests : la clé n'existe que le temps de la signature.
      - name: Clé d'API App Store Connect
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Signature, essai à blanc
        # Mêmes variables qu'à l'étape « Construire le .dmg ».
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Une configuration de signature incomplète s'arrête là, avant la construction.
        run: pnpm package --dry-run --strict

      - name: Construire le .dmg
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm package --strict --publish never

      # Signée : ce que Gatekeeper dira de l'app téléchargée (le .dmg est vérifié par
      # `scripts/signing.mts notarize-dmg`).
      - name: Vérifier la signature et la notarisation
        env:
          SIGNED: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
        run: |
          app=dist/mac-arm64/Bobine.app
          codesign --verify --deep --strict "$app"
          if [[ "$SIGNED" == true ]]; then
            spctl --assess --type exec -vv "$app"
            xcrun stapler validate "$app"
          else
            codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          fi

      # Version courte d'Info.plist en trois entiers (fiche 218, `scripts/package`), version
      # complète ailleurs.
      - name: Versions d'Info.plist
        run: |
          version="$(node -p "require('./package.json').version")"
          plist=dist/mac-arm64/Bobine.app/Contents/Info.plist
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          echo "CFBundleShortVersionString=$short CFBundleVersion=$bundle"
          test "$short" = "${version%%[-+]*}"
          test "$bundle" = "$version"

      - name: Essai natif du DMG (agent factice)
        run: |
          test "$(node -p 'process.arch')" = arm64
          version="$(node -p "require('./package.json').version")"
          smoke_mount="$(mktemp -d "$RUNNER_TEMP/bobine-dmg-smoke.XXXXXX")"
          # Après l'essai, un processus de l'app (terminal, AXe) peut tenir le volume quelques
          # secondes : on réessaie, puis on force le démontage (« Resource busy », 0.7.0).
          cleanup() {
            for _ in 1 2 3 4 5; do
              hdiutil detach "$smoke_mount" && break
              sleep 3
            done
            if mount | grep -q " on $smoke_mount "; then hdiutil detach -force "$smoke_mount"; fi
            if [[ -d "$smoke_mount" ]]; then rmdir "$smoke_mount"; fi
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$smoke_mount" "dist/Bobine-$version-arm64.dmg"
          file "$smoke_mount/Bobine.app/Contents/MacOS/Bobine" | grep -q arm64
          BOBINE_PACKAGED_APP="$smoke_mount/Bobine.app" node e2e/packaged-ci.mjs

      - name: Capture de l’essai natif
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bobine-dmg-smoke
          path: e2e/captures/packaged.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Effacer la clé d'API
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Pour le job `publish` (tag) ou à télécharger (lancement à la main).
      - name: Artefact .dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bobine-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: AppImage et .deb (Linux ${{ matrix.arch }})
    needs: guard
    # Linux expérimental : jamais publié avec un tag sans BOBINE_LINUX_RELEASE (voir en tête).
    if: github.ref_type != 'tag' || vars.BOBINE_LINUX_RELEASE == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # node-pty se compile (pas de binaire précompilé pour Linux).
      - name: Outils de compilation
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: pnpm install --frozen-lockfile

      # Comme dans ci.yml : pnpm ne lance pas son script d'installation (`allowBuilds`), et les
      # tests du terminal (vrai shell) en ont besoin avant `verify`.
      - name: Compiler node-pty (pas de binaire précompilé pour Linux)
        run: cd node_modules/node-pty && npx --yes node-gyp@12 rebuild && node scripts/post-install.js

      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      - run: ./scripts/verify

      - name: Construire l'AppImage et le .deb
        run: pnpm package --linux --publish never

      - name: Sommes SHA-256
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          version="$(node -p "require('../package.json').version")"
          sha256sum Bobine-"$version"-*.AppImage Bobine-"$version"-*.deb > "SHA256SUMS-linux-$ARCH.txt"
          cat "SHA256SUMS-linux-$ARCH.txt"

      # Pour le job `publish` (tag) ou à télécharger (lancement à la main).
      - name: Artefact Linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bobine-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux-*.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Release GitHub
    needs: [dmg, linux]
    # Au tag seulement, .dmg construit et essayé ; Linux construit, ou sauté faute de
    # BOBINE_LINUX_RELEASE. Un échec de Linux (activé) ne publie rien : pas de Release à moitié.
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.dmg.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Seulement les deux changelogs (notes) : rien du dépôt n'est installé ni lancé ici.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.en.md
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bobine-dmg
          path: dist

      - if: needs.linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bobine-linux-*
          merge-multiple: true
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Notes en anglais puis en français (fiche 220) : la section de la version dans
        # CHANGELOG.en.md (« ## X.Y.Z — November 10, 2026 ») et dans CHANGELOG.md
        # (« ## X.Y.Z — 10 novembre 2026 »), préversion comprise (« ## 1.0.0-beta.1 — date »).
        # Une langue sans section est omise ; aucune des deux : la liste des commits de GitHub.
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v v="$version" '/^## / { inside = index($0, "## " v " ") == 1; next } inside' "$1"
          }
          section CHANGELOG.en.md > notes-en.md
          section CHANGELOG.md > notes-fr.md
          : > notes.md
          if grep -q '[^[:space:]]' notes-en.md; then
            { echo '## English'; cat notes-en.md; } >> notes.md
          fi
          if grep -q '[^[:space:]]' notes-fr.md; then
            if [[ -s notes.md ]]; then printf '\n---\n\n' >> notes.md; fi
            { echo '## Français'; cat notes-fr.md; } >> notes.md
          fi
          if [[ -s notes.md ]]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          cat notes.md
          # Préversion semver (`1.0.0-beta.1`, `1.0.0-rc.2`) : jamais « Latest ».
          if [[ "$version" == *-* ]]; then kind=(--prerelease --latest=false); else kind=(); fi
          # Linux seulement s'il a été construit (BOBINE_LINUX_RELEASE) ; le .dmg toujours.
          shopt -s nullglob
          files=(dist/*.dmg dist/*.AppImage dist/*.deb dist/SHA256SUMS-linux-*.txt)
          ls -l "${files[@]}"
          test -f "dist/Bobine-$version-arm64.dmg"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "Bobine $version" \
            "${notes[@]}" ${kind[@]+"${kind[@]}"}
