# Fumée sur le plancher d'Electron (fiche 288, ADR-0074 ; scripts et décision sur la branche `1.2`) :
# l'app doit encore marcher et se construire avec l'Electron minimal du dépôt
# (`scripts/electron-floor.json`), celui d'un Mac qui ne peut pas obtenir la version fixée. Mêmes
# commandes que l'utilisateur : archive officielle installée par `pnpm electron-local` (empreinte
# du dépôt vérifiée), fumée e2e (journées `parcours-*`, ADR-0069, `startup` et `about`),
# `pnpm package --dir`, `pnpm e2e:packaged` ; puis le dépôt doit rester propre (`git status`).
#
# Fichier identique sur `main` et sur `1.2` : GitHub ne lance un workflow (nuit ou à la main) que
# s'il existe sur la branche par défaut (`main`), et `schedule` ne part que d'elle. La nuit joue
# donc la branche `1.2`, en dur : la ligne 1.2 n'est jamais fusionnée dans `main` (ADR-0073), et
# c'est elle que l'on construit sur le plancher. À revoir quand la 1.2 deviendra `main`. À la main :
# la branche choisie au lancement ; sans `scripts/electron-floor.json` (cas de `main` aujourd'hui),
# le job s'arrête tout de suite en le disant.
#
# Jamais sur les pull requests ni à chaque poussée. 05:43 UTC : après la nuit d'`e2e.yml` (03:17,
# 90 min au plus sur le Mac), hors de l'heure pile.
name: Electron floor

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    name: Plancher d'Electron (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La nuit : la ligne 1.2 (voir en tête) ; à la main : la branche choisie.
          ref: ${{ github.event_name == 'schedule' && '1.2' || github.ref }}
          persist-credentials: false
      - name: Plancher défini sur cette branche
        run: |
          if [[ ! -f scripts/electron-floor.json ]]; then
            echo "::error::Pas de plancher d'Electron sur cette branche (scripts/electron-floor.json absent) : il vit sur la ligne 1.2 (fiche 288, ADR-0074). Lancer ce workflow sur 1.2."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Archive officielle du plancher, téléchargée à part comme l'utilisateur l'obtient ailleurs ;
      # `electron-local` la refuse si son empreinte n'est pas celle du dépôt.
      - name: Plancher installé par pnpm electron-local
        run: |
          floor="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/electron-floor.mts version)"
          name="electron-v${floor}-darwin-arm64.zip"
          dir="$(mktemp -d "$RUNNER_TEMP/electron-floor.XXXXXX")"
          curl -fsSL --retry 3 -o "$dir/$name" \
            "https://github.com/electron/electron/releases/download/v${floor}/${name}"
          pnpm electron-local "$dir/$name"
          echo "FLOOR=$floor" >> "$GITHUB_ENV"
      - run: pnpm build
      # Écran 1920 × 1080, comme dans e2e.yml (fiche 250).
      - name: Écran 1920 × 1080
        run: scripts/ci/macos-screen.sh
      # `parcours-outils` reste hors de la fumée sur ce runner (navigateur intégré instable sur la
      # VM, indicative dans e2e.yml) ; jouée en local.
      - name: Fumée e2e sur le plancher
        run: |
          pnpm e2e startup about parcours-premier-lancement parcours-matinee parcours-deleguer \
            parcours-reglages parcours-longue parcours-pannes parcours-tour-de-table
      - run: pnpm package --dir
      - name: Electron de l'app construite
        run: |
          plist="dist/mac-arm64/Bobine.app/Contents/Frameworks/Electron Framework.framework/Resources/Info.plist"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          echo "Electron de l'app : $built (plancher : $FLOOR)"
          if [[ "$built" != "$FLOOR" ]]; then
            echo "::error::L'app embarque Electron $built, attendu le plancher $FLOOR."
            exit 1
          fi
      - run: pnpm e2e:packaged
      # Construire sur le plancher ne modifie aucun fichier suivi (package.json, lockfile, avis).
      - name: Dépôt propre
        run: |
          changed="$(git status --porcelain)"
          if [[ -n "$changed" ]]; then
            echo "::error::Fichiers modifiés par la construction sur le plancher :"
            echo "$changed"
            exit 1
          fi
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-floor-captures
          path: e2e/captures/
          retention-days: 7
