# Vérification (fiches 105, 229) : `./scripts/verify` (lint, typecheck, tests unitaires) à chaque
# pull request et à chaque poussée sur `main` (et sur `1.1` et `1.2`, ADR-0068, ADR-0073), **sur les trois systèmes**
# (macOS, Linux, Windows), chacun bloquant : décision de Jérôme (2026-11-15), « rends la CI bloquante sur les trois ». Une
# version ne se construit que si ces trois jobs sont verts pour son commit (`release.yml`).
# Les essais de bout en bout ne sont pas ici : `e2e.yml` (Linux à chaque poussée sur `main`, non
# bloquant ; macOS et Windows à la main), et en local avant chaque poussée (AGENTS.md).
# Runners nommés par version (`ubuntu-26.04`, `macos-26`, `windows-2025`), jamais `-latest` : une
# autre image est une décision, pas une bascule de GitHub (fiche 273, LCM-11).
name: CI

on:
  pull_request:
  push:
    # `1.1` et `1.2` aussi : leurs préversions se publient depuis elles, et `release.yml` exige
    # `ci.yml` vert sur le commit tagué (ADR-0068, ADR-0073). Aucune autre branche.
    branches: [main, '1.1', '1.2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm : la version de `packageManager` (package.json).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Electron ne se télécharge pas : son paquet npm n'a plus de script d'installation, et ni le
      # typecheck ni les tests n'en ont besoin.
      - run: pnpm install --frozen-lockfile

      # `node-pty` n'a pas de binaire précompilé pour Linux, et pnpm ne lance pas son script
      # d'installation (`allowBuilds: node-pty: false` dans pnpm-workspace.yaml, voulu sur macOS
      # où le binaire est livré). Compilé ici explicitement : python3, make et g++ sont sur
      # ubuntu-26.04 ; le module se charge depuis build/Release. Premier passage (2026-10-21) :
      # sans cette étape, les deux tests « terminaux (vrai shell) » échouaient.
      - name: Compiler node-pty (pas de binaire précompilé pour Linux)
        run: cd node_modules/node-pty && npx --yes node-gyp@12 rebuild && node scripts/post-install.js

      # Des tests créent des commits dans des dépôts jetables.
      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      # Les tests propres à macOS (`scripts/electron-local.test.ts` : ditto, xattr, PlistBuddy)
      # se sautent d'eux-mêmes hors macOS ; les autres injectent leurs commandes.
      - run: ./scripts/verify

  # macOS, la plateforme principale : le même `verify` sur un Mac de GitHub (node-pty y livre son
  # binaire, rien à compiler ; les essais propres à macOS y tournent).
  verify-macos:
    name: verify (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      - run: ./scripts/verify

  # Windows (fiche 229) : le même `verify` sur `windows-2025`, par le bash de Git for Windows
  # (présent sur le runner, et prérequis de Bobine sous Windows). Bloquant depuis le lot 7a :
  # 0 échec relevé dans la VM Windows 11 ARM64 ; les essais sans objet sous Windows y sont sautés
  # par capacité (`src/main/test-platform.ts`).
  verify-windows:
    name: verify (Windows)
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # Avant le checkout : fins de ligne LF comme dans le dépôt (sinon Prettier refuse chaque
      # fichier, et les essais qui lisent des fichiers du dépôt voient des CRLF).
      - name: Fins de ligne (LF)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # node-pty livre ses binaires Windows (x64, arm64) : rien à compiler.
      - run: pnpm install --frozen-lockfile

      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      - run: ./scripts/verify

  # Secrets (fiche 218) : gitleaks sur tout l'historique à chaque pull request et poussée sur
  # `main`. Binaire officiel, version et SHA-256 épinglés (pas l'action gitleaks-action : licence
  # demandée aux organisations, et le binaire suffit). Fausses alertes connues (clés factices des
  # tests) : `.gitleaksignore`, une empreinte par ligne, avec la raison.
  secrets:
    name: gitleaks (historique)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Chercher des secrets
        run: gitleaks git --redact --no-banner --verbose .
