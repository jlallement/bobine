# Vérification (fiche 105) : `./scripts/verify` (lint, typecheck, tests unitaires) à chaque pull
# request et à chaque poussée sur `main`, sur Linux : rapide, et gratuit sur un dépôt public.
# Les essais de bout en bout (Electron, Mac requis) ne sont pas ici : `e2e.yml` à la main, et en
# local avant chaque poussée (AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm : la version de `packageManager` (package.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # Electron ne se télécharge pas : son paquet npm n'a plus de script d'installation, et ni le
      # typecheck ni les tests n'en ont besoin.
      - run: pnpm install --frozen-lockfile

      # `node-pty` n'a pas de binaire précompilé pour Linux, et pnpm ne lance pas son script
      # d'installation (`allowBuilds: node-pty: false` dans pnpm-workspace.yaml, voulu sur macOS
      # où le binaire est livré). Compilé ici explicitement : python3, make et g++ sont sur
      # ubuntu-latest ; le module se charge depuis build/Release. Premier passage (2026-10-21) :
      # sans cette étape, les deux tests « terminaux (vrai shell) » échouaient.
      - name: Compiler node-pty (pas de binaire précompilé pour Linux)
        run: cd node_modules/node-pty && npx --yes node-gyp@12 rebuild && node scripts/post-install.js

      # Des tests créent des commits dans des dépôts jetables.
      - name: Identité git pour les tests
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"

      # Les tests propres à macOS (`scripts/electron-local.test.ts` : ditto, xattr, PlistBuddy)
      # se sautent d'eux-mêmes hors macOS ; les autres injectent leurs commandes.
      - run: ./scripts/verify

  # Secrets (fiche 218) : gitleaks sur tout l'historique à chaque pull request et poussée sur
  # `main`. Binaire officiel, version et SHA-256 épinglés (pas l'action gitleaks-action : licence
  # demandée aux organisations, et le binaire suffit). Fausses alertes connues (clés factices des
  # tests) : `.gitleaksignore`, une empreinte par ligne, avec la raison.
  secrets:
    name: gitleaks (historique)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Chercher des secrets
        run: gitleaks git --redact --no-banner --verbose .
