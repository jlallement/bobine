# Essais de bout en bout (fiche 105) : la suite complète (`pnpm e2e`, clair et sombre, puis en
# anglais) sur un Mac de GitHub, lancée à la main depuis l'onglet Actions, et chaque nuit (fiche
# 250 : dépôt public, minutes des runners standard gratuites, macOS compris). Le job Linux part
# aussi de lui-même à chaque poussée sur `main` (fiche 229). Pas rattachée au tag ni aux pull
# requests : la suite Mac complète tourne en local avant chaque tag. Les captures sont gardées en
# artefact pour être regardées.
#
# Linux, préversion (fiche 145) : la même suite sous Ubuntu, dans un écran virtuel (`xvfb`) avec
# un gestionnaire de fenêtres (openbox), en français seulement ; en local : `pnpm e2e:linux`. Les
# suites qui demandent une capacité absente de Linux (simulateur iOS) sont sautées et nommées par
# le lanceur ; celles en quarantaine sous Linux (`quarantine` de `e2e/catalog.mjs` : `terminal`,
# flèche powerline) sont écartées et dites, avec une annotation à chaque passage (fiche 250).
#
# Windows, expérimental (fiche 229) : la même suite sur `windows-latest` (bureau réel, pas d'écran
# virtuel), en français, en Git Bash ; pnpm lance aussi ses scripts par bash (`script-shell`),
# puisque `pree2e` est un script bash. Très rouge tant que les lots 2, 3 et 7 (processus, chemins,
# faux outils en node) ne sont pas dans `main`. « les-deux » reste macOS + Linux.
name: End-to-end

on:
  # Linux à chaque poussée sur `main` (fiche 229) ; macOS chaque nuit (fiche 250) ; le reste à la main.
  push:
    branches: [main]
  # 03:17 UTC, hors de l'heure pile (moins de files d'attente). Sur la branche par défaut seulement.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites à lancer (vide : toutes ; `pnpm e2e --list`)'
        required: false
        default: ''
      systeme:
        description: 'Système'
        type: choice
        options: [macos, linux, windows, les-deux]
        default: macos

permissions:
  contents: read

# Suites demandées : passées par l'environnement, jamais interpolées dans un `run:` (fiche 218),
# et refusées si elles contiennent autre chose que des noms et des options (`--jobs 1`).
env:
  SUITES: ${{ inputs.suites }}

jobs:
  e2e:
    name: pnpm e2e (macOS arm64)
    if: github.event_name == 'schedule' || inputs.systeme == 'macos' || inputs.systeme == 'les-deux'
    runs-on: macos-15
    # Français puis anglais, 3 suites à la fois sur un runner à 3 cœurs : large, jamais mesuré ici.
    timeout-minutes: 90
    steps:
      - name: Suites demandées
        run: |
          if [[ ! "$SUITES" =~ ^[A-Za-z0-9\ ._=-]*$ ]]; then
            echo "::error::Suites refusées : seulement des noms de suites et des options (pnpm e2e --list)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Découpage voulu en mots (suites et options), chacun passé tel quel.
      - name: Essais (français)
        run: |
          read -ra suites <<< "$SUITES"
          pnpm e2e ${suites[@]+"${suites[@]}"}
      - name: Essais (anglais)
        run: |
          read -ra suites <<< "$SUITES"
          pnpm e2e --lang en ${suites[@]+"${suites[@]}"}
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-captures
          path: e2e/captures/
          retention-days: 7

  # Lancé aussi à chaque poussée sur `main` (fiche 229). Non bloquant (`continue-on-error`) tant
  # qu'il n'a pas été vert plusieurs fois de suite après la quarantaine de `terminal` (fiche 250).
  e2e-linux:
    name: pnpm e2e (Linux x64)
    if: github.event_name == 'push' || inputs.systeme == 'linux' || inputs.systeme == 'les-deux'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Suites demandées
        run: |
          if [[ ! "$SUITES" =~ ^[A-Za-z0-9\ ._=-]*$ ]]; then
            echo "::error::Suites refusées : seulement des noms de suites et des options (pnpm e2e --list)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # node-pty se compile (pas de binaire précompilé pour Linux) ; xvfb : écran virtuel ; openbox :
      # gestionnaire de fenêtres (sans lui, ni agrandissement ni focus : `scripts/with-wm`). Puis les
      # dépendances du .deb (celles d'electron-builder, comme l'image de `pnpm e2e:linux`) : sans
      # libnotify4, `Notification.isSupported()` est faux et l'app n'affiche aucune notification.
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb openbox x11-utils \
            libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0t64 \
            libuuid1 libsecret-1-0
      - run: pnpm install --frozen-lockfile
      # Comme dans ci.yml : pnpm ne lance pas son script d'installation (`allowBuilds`).
      - name: Compiler node-pty
        run: cd node_modules/node-pty && npx --yes node-gyp@12 rebuild && node scripts/post-install.js
      - name: Identité git pour les essais
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"
      # Ubuntu 24.04 refuse les espaces de noms aux programmes sans profil AppArmor : le bac à sable
      # de Chromium (Electron de node_modules) ne démarrerait pas. Réglage de la machine de CI
      # seulement ; l'app garde son bac à sable (jamais de --no-sandbox).
      - name: Bac à sable de Chromium
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      # Deux tâches à la fois : la machine a 2 cœurs ; à 3, des essais liés au temps (infobulles,
      # durées) échouaient d'un passage à l'autre (fiche 145). Une option `--jobs` des suites
      # demandées passe après et l'emporte. Chaque tâche a son propre écran X et son openbox
      # (`e2e/pool.mjs`) : l'écran englobant ne sert qu'aux suites jouées une à une.
      # Sans suites demandées : tout sauf `perf`, jouée à part juste après. Sur cette machine (2 cœurs
      # partagés, rendu logiciel, caches froids au premier lancement), ses durées varient du simple
      # au quadruple d'un passage à l'autre (diff de 5000 lignes : 434 puis 5369 ms) : ses seuils y
      # mesurent la machine, pas l'app. Ils restent tenus sur le Mac et dans `pnpm e2e:linux`.
      - name: Essais (français)
        run: |
          read -ra suites <<< "$SUITES"
          skip=()
          [[ ${#suites[@]} -eq 0 ]] && skip=(--skip perf)
          xvfb-run -a -s "-screen 0 1920x1200x24" scripts/with-wm pnpm e2e --jobs 2 ${skip[@]+"${skip[@]}"} ${suites[@]+"${suites[@]}"}
      # `perf` jouée et montrée, sans faire échouer le job (voir plus haut) : ses mesures restent lisibles.
      - name: Mesures de performance (indicatives sur cette machine)
        if: always() && env.SUITES == ''
        continue-on-error: true
        run: xvfb-run -a -s "-screen 0 1920x1200x24" scripts/with-wm pnpm e2e perf
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-captures-linux
          path: e2e/captures/
          retention-days: 7

  e2e-windows:
    name: pnpm e2e (Windows x64, expérimental)
    if: inputs.systeme == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Scripts de package.json (`pree2e` : ./scripts/check-electron) par bash, pas par `cmd`.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    steps:
      - name: Suites demandées
        run: |
          if [[ ! "$SUITES" =~ ^[A-Za-z0-9\ ._=-]*$ ]]; then
            echo "::error::Suites refusées : seulement des noms de suites et des options (pnpm e2e --list)."
            exit 1
          fi
      - name: Fins de ligne (LF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Identité git pour les essais
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"
      - run: pnpm build
      - name: Essais (français)
        run: |
          read -ra suites <<< "$SUITES"
          pnpm e2e ${suites[@]+"${suites[@]}"}
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-captures-windows
          path: e2e/captures/
          retention-days: 7
