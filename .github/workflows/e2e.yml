# Essais de bout en bout (fiche 105) : la suite complète (`pnpm e2e`, clair et sombre, puis en
# anglais) sur un Mac de GitHub, lancée à la main depuis l'onglet Actions. Pas rattachée au tag ni
# aux pull requests : Electron doit encore faire ses preuves sur un runner GitHub (fenêtres,
# presse-papiers, menus), et un échec ne doit pas bloquer une version. Les captures sont gardées
# en artefact pour être regardées.
#
# Linux, expérimental (fiche 145) : la même suite sous Ubuntu, dans un écran virtuel (`xvfb`), en
# français seulement. Les suites qui demandent une capacité absente de Linux (simulateur iOS) sont
# sautées et nommées par le lanceur ; un échec dit ce qui reste à faire pour la préversion.
name: End-to-end

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites à lancer (vide : toutes ; `pnpm e2e --list`)'
        required: false
        default: ''
      systeme:
        description: 'Système'
        type: choice
        options: [macos, linux, les-deux]
        default: macos

permissions:
  contents: read

# Suites demandées : passées par l'environnement, jamais interpolées dans un `run:` (fiche 218),
# et refusées si elles contiennent autre chose que des noms et des options (`--jobs 1`).
env:
  SUITES: ${{ inputs.suites }}

jobs:
  e2e:
    name: pnpm e2e (macOS arm64)
    if: inputs.systeme != 'linux'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Suites demandées
        run: |
          if [[ ! "$SUITES" =~ ^[A-Za-z0-9\ ._=-]*$ ]]; then
            echo "::error::Suites refusées : seulement des noms de suites et des options (pnpm e2e --list)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Découpage voulu en mots (suites et options), chacun passé tel quel.
      - name: Essais (français)
        run: |
          read -ra suites <<< "$SUITES"
          pnpm e2e ${suites[@]+"${suites[@]}"}
      - name: Essais (anglais)
        run: |
          read -ra suites <<< "$SUITES"
          pnpm e2e --lang en ${suites[@]+"${suites[@]}"}
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-captures
          path: e2e/captures/
          retention-days: 7

  e2e-linux:
    name: pnpm e2e (Linux x64, expérimental)
    if: inputs.systeme != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Suites demandées
        run: |
          if [[ ! "$SUITES" =~ ^[A-Za-z0-9\ ._=-]*$ ]]; then
            echo "::error::Suites refusées : seulement des noms de suites et des options (pnpm e2e --list)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # node-pty se compile (pas de binaire précompilé pour Linux) ; xvfb : écran virtuel.
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb
      - run: pnpm install --frozen-lockfile
      # Comme dans ci.yml : pnpm ne lance pas son script d'installation (`allowBuilds`).
      - name: Compiler node-pty
        run: cd node_modules/node-pty && npx --yes node-gyp@12 rebuild && node scripts/post-install.js
      - name: Identité git pour les essais
        run: |
          git config --global user.name "Bobine CI"
          git config --global user.email "ci@users.noreply.github.com"
      # Ubuntu 24.04 refuse les espaces de noms aux programmes sans profil AppArmor : le bac à sable
      # de Chromium (Electron de node_modules) ne démarrerait pas. Réglage de la machine de CI
      # seulement ; l'app garde son bac à sable (jamais de --no-sandbox).
      - name: Bac à sable de Chromium
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      - name: Essais (français)
        run: |
          read -ra suites <<< "$SUITES"
          xvfb-run -a -s "-screen 0 1920x1200x24" pnpm e2e ${suites[@]+"${suites[@]}"}
      - name: Captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-captures-linux
          path: e2e/captures/
          retention-days: 7
