# Dépendances autorisées à exécuter un script d'installation (binaires natifs).
allowBuilds:
  electron: true
  esbuild: true
  # Binaires précompilés (N-API) livrés dans le paquet : pas de compilation à l'installation.
  node-pty: false
  # Installateur Windows tiré par electron-builder : inutile sur macOS.
  electron-winstaller: false
  # Objets de tâche de Windows (ADR-0050) : `cnoke` choisit le binaire précompilé de la
  # plateforme (@koromix/koffi-*), sans rien compiler.
  koffi: true
# GHSA-g3hv-75wg-m249 (minimatch >=7 <11.0.1, outillage seulement : electron-builder,
# typescript-eslint). minimatch 11 retire makeRe, regexp et AST, que ces paquets n'utilisent pas ;
# l'app construite est identique octet pour octet (fiche 233). À retirer quand ils l'exigent d'eux-mêmes.
overrides:
  'minimatch@>=7.0.0 <11.0.1': 11.0.8
