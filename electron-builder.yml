# Packaging (fiches 012, 153) : electron-builder produit l’app, le hook natif le DMG ; le
# .deb sous Linux (fiche 145, ADR-0032, ADR-0051 : construit sous Linux, une architecture par
# machine).
# Identifiant d'avant le nom « Bobine », gardé (ADR-0012) : autorisations de macOS (notifications…)
# et réglages rattachés à l'app restent valables.
appId: dev.bobine.app
productName: Bobine
copyright: Copyright © 2026 Jérôme Lallement
directories:
  output: dist
  buildResources: build
# Electron repris de node_modules (déjà installé, vérifié) : rien à télécharger pour construire
# l'app, même sans réseau (fiche 065). C'est celui du système qui construit : l'app Linux se
# construit donc sous Linux (fiche 145).
electronDist: node_modules/electron/dist
# Seul le résultat du build entre dans l'app ; l'agent factice (src/mock-agent) reste au dépôt.
# Les dépendances de production (node-pty, @xterm/headless…) sont ajoutées par electron-builder.
files:
  - out/**
  - package.json
  - '!**/*.map'
  # Inventaire des paquets embarqués (fiche 217) : sert aux avis de licence, pas à l'app.
  - '!out/third-party/**'
  # node-pty : seuls les binaires précompilés pour macOS servent (pas les sources ni Windows).
  - '!node_modules/node-pty/{src,deps,third_party,scripts,binding.gyp,typings}/**'
  - '!node_modules/node-pty/prebuilds/win32-*/**'
  - '!node_modules/node-pty/lib/**/*.test.js'
  # En-têtes C++ pour compiler node-pty : inutiles avec les binaires précompilés.
  - '!node_modules/node-addon-api/**'
  # koffi (objets de tâche de Windows, ADR-0050) : jamais livré dans les apps Mac et Linux (ni son
  # code, ni ses binaires @koromix/koffi-*). Ici, et non sous `mac:` : une liste de seules
  # exclusions par plateforme fait ajouter `**/*` par electron-builder (tout le dépôt dans l'app).
  # Le paquet Windows (fiche 229, lot 6) devra l'y remettre.
  - '!node_modules/koffi/**'
  - '!node_modules/@koromix/**'
# Textes de licence (fiche 217), dans Contents/Resources/licenses (macOS) et resources/licenses
# (Linux) : ceux de Bobine, les avis des composants tiers (`pnpm third-party-notices`, vérifiés
# avant la construction par scripts/package), ceux d'Electron et de Chromium, et ceux de la police
# embarquée. Complète les extraResources de chaque système (AXe sous macOS).
extraResources:
  - from: LICENSE
    to: licenses/LICENSE
  - from: NOTICE
    to: licenses/NOTICE
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: node_modules/electron/dist/LICENSE
    to: licenses/electron/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/electron/LICENSES.chromium.html
  # Polices livrées : MesloLGS Nerd Font (terminal), Inter et JetBrains Mono (fiche 145, D9).
  - from: src/renderer/src/assets/fonts
    to: licenses/fonts
    filter: ['*.txt']
# Langues de l'interface de Chromium (menus contextuels, boîtes de dialogue) : celles de l'app.
electronLanguages: [fr, en]
# node-pty est livré précompilé pour macOS (N-API, valable pour toute version d'Electron) : pas de
# recompilation. Sous Linux, `pnpm package --linux` le compile avant s'il manque (fiche 145).
npmRebuild: false
# Module natif et `spawn-helper` (lancé par node-pty) : hors de l'archive asar, pour être exécutables.
# `build/Release` : le module compilé sous Linux.
asarUnpack:
  - node_modules/node-pty/prebuilds/**
  - node_modules/node-pty/build/Release/**
# Verrous de l'exécutable Electron (« fuses ») : l'app packagée ne sert pas de Node générique et
# ne charge que son archive, vérifiée. L'agent factice (ELECTRON_RUN_AS_NODE) n'existe qu'en dev.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Electron local : architecture de la machine, arm64 sur le runner de publication.
  target: dir
  # Signature : scripts/package choisit (scripts/signing.mts, fiche 111) : ad hoc par défaut,
  # certificat Developer ID seulement s'il est désigné ; `pnpm package --dry-run` dit lequel.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Activée par scripts/package (avec dmg.sign) quand les identifiants Apple sont fournis.
  notarize: false
  # AXe (ADR-0009, fiche 043) : touchers, lecture d'écran et vidéo du simulateur iOS, livré avec
  # l'app. `scripts/fetch-axe` le met dans vendor/axe (version épinglée, SHA-256 et signature
  # vérifiés) ; copié dans Contents/Resources/axe et re-signé avec l'app (mêmes droits que
  # build/entitlements.mac.plist). Ses frameworks gardent leurs liens symboliques.
  extraResources:
    - from: vendor/axe
      to: axe
  extendInfo:
    # Thème clair / sombre suivi automatiquement.
    NSRequiresAquaSystemAppearance: false
# Le hook crée le DMG avant la fermeture du trousseau temporaire de signature (ADR-0034).
afterSign: ./scripts/native-dmg.mts
dmg:
  title: Bobine
  artifactName: Bobine-${version}-${arch}.${ext}
  writeUpdateInfo: false
  # Configuration de nom/signature lue par le hook, sans lancer la cible dmg-builder.
# Préversion Windows (fiche 229, D1 à D3, ADR-0050) : installeur NSIS pour l'utilisateur seul
# (`%LOCALAPPDATA%\Programs\bobine`, jamais de droits d'administrateur), raccourcis du menu Démarrer
# et du bureau, x64 et arm64 (une construction par architecture : `pnpm package --win`). Pas de
# signature : SmartScreen avertit au premier lancement, la somme SHA-256 est publiée.
win:
  icon: build/icon.ico
  target: nsis
  # Rien à publier pour une mise à jour automatique (il n'y en a pas) : pas de latest.yml.
  publish: null
  # Fichiers : `scripts/package-win.mts` reprend la liste `files` de la racine (jamais une liste à
  # part ici : une liste de seules exclusions y ferait entrer tout le dépôt) et l'adapte à Windows :
  # node-pty et koffi de l'architecture construite seulement (`windowsFiles`), sans .pdb ni winpty.
  # Le .node de koffi (objets de tâche, ADR-0050) hors de l'asar, comme celui de node-pty.
  asarUnpack:
    - node_modules/@koromix/koffi-win32-*/**/*.node
  # ConPTY (conpty.dll, OpenConsole.exe) vient de Windows Terminal (Microsoft, MIT) : son texte de
  # licence est livré à côté des autres (fiche 217).
  # koffi est exclu des avis de licence (absent des apps Mac et Linux, `EXCLUDED_FROM_APP`) : son
  # texte (MIT, aussi celui de ses binaires `@koromix/koffi-*`) est livré ici.
  extraResources:
    - from: scripts/third-party/texts/microsoft-terminal-LICENSE.txt
      to: licenses/conpty/LICENSE.txt
    - from: node_modules/koffi/LICENSE.txt
      to: licenses/koffi/LICENSE.txt
# NSIS 3.12 en un seul paquet (makensis pour macOS arm64, Linux et Windows), au lieu du 3.0.4 de
# 2019 dont le makensis pour macOS n'existe qu'en x86_64 (Rosetta). Même outil sur le Mac et sur le
# runner Windows de GitHub. Ne sert qu'à l'installeur Windows.
toolsets:
  nsis: '1.2.1'
nsis:
  # Un clic, sans choix : pour l'utilisateur seul, donc jamais d'élévation (D1).
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bobine
  # Données gardées à la désinstallation, comme sur le Mac.
  deleteAppDataOnUninstall: false
  artifactName: Bobine-${version}-${arch}.${ext}
  # Pas de mise à jour automatique (fiche 229, section 10) : pas de .blockmap (ni de latest.yml :
  # `win.publish`).
  differentialPackage: false
# Préversion Linux (fiche 145, ADR-0032) : le .deb seul (Ubuntu, Debian ; ADR-0051 : une AppImage
# n'a pas le profil AppArmor que le .deb pose pour /opt/Bobine/bobine, et le bac à sable de
# Chromium n'y démarre pas sur Ubuntu 24.04 et plus), pour l'architecture de la machine qui
# construit (x64 et arm64 : une machine GitHub chacune). Pas de signature : la somme SHA-256 est
# publiée avec la version.
linux:
  target: deb
  category: Development
  # Tailles du thème hicolor, de 16 à 512 px (`scripts/make-icon.mjs --linux`) : une icône seule
  # en 1024 n'est pas trouvée par GNOME (pas de dossier 1024x1024 dans hicolor).
  icon: build/icons
  executableName: bobine
  # Fichier `bobine.desktop` nommé d'après `desktopName` (package.json) : Electron en tire l'app_id
  # de la fenêtre sous Wayland (WM_CLASS sous X11), qui la rattache à son entrée dans le dock.
  syncDesktopName: true
  synopsis: Desktop app for ACP coding agents
  # Champ exigé par le .deb (sinon lu dans `author` de package.json, qui n'a pas d'adresse).
  maintainer: Bobine <https://github.com/jlallement/bobine>
  artifactName: Bobine-${version}-${arch}.${ext}
  # Les `files` de la racine, repris tels quels, puis ce qui est propre à Linux. Une liste de
  # seules exclusions ici fait ajouter `**/*` par electron-builder : le dépôt entier (src/, docs/,
  # e2e/, fichiers locaux) entrait dans le .deb (constaté le 2026-11-15). Les deux listes doivent
  # rester identiques : `scripts/check-linux-package.test.ts` le vérifie, et le contrôle du .deb
  # (`check-linux-package.mts`) refuse tout ce qui n'est pas `out/`, `package.json` ou
  # `node_modules/` dans `app.asar`.
  files:
    - out/**
    - package.json
    - '!**/*.map'
    - '!out/third-party/**'
    - '!node_modules/node-pty/{src,deps,third_party,scripts,binding.gyp,typings}/**'
    - '!node_modules/node-pty/prebuilds/win32-*/**'
    - '!node_modules/node-pty/lib/**/*.test.js'
    - '!node_modules/node-addon-api/**'
    - '!node_modules/koffi/**'
    - '!node_modules/@koromix/**'
    # node-pty : le module compilé sous Linux (build/Release) ; ses binaires macOS ne servent pas.
    - '!node_modules/node-pty/prebuilds/**'
# Icône vectorielle (hicolor/scalable) en plus des PNG : electron-builder ne prend qu'un dossier de
# PNG ou une seule SVG, la SVG est donc ajoutée au .deb par fpm (chemin relatif à la racine).
# Vérifié après la construction par `scripts/check-linux-package.mts` (fiche 145).
deb:
  fpm:
    - build/icon.svg=/usr/share/icons/hicolor/scalable/apps/bobine.svg
